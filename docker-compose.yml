services:

    php:
        build:
            context: .
            args:
                USER_ID: ${UID:-1000}
                GROUP_ID: ${GID:-1000}
        container_name: ${PROJECT_NAME}_php
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
            - "443:443/udp"
        environment:
            SERVER_NAME: localhost
            MAILER_DSN: smtp://mailhog:1025
            
        volumes:
            - ./:/app
            - caddy_data:/data
            - caddy_config:/config
        depends_on:
            database:
                condition: service_healthy
            redis:
                condition: service_healthy
            mailhog:
                condition: service_started
        networks:
            - default

    database:
        image: mysql:8.4
        container_name: ${PROJECT_NAME}_mysql
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${MYSQL_DATABASE}
            MYSQL_USER: ${MYSQL_USER}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
        ports:
            - "3306:3306"
        volumes:
            - database_data:/var/lib/mysql
            - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 20s
        networks:
            default:
                aliases:
                    - mysql

    redis:
        image: redis:7-alpine
        container_name: ${PROJECT_NAME}_redis
        restart: unless-stopped
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10
        networks:
            - default

   

    mailhog:
        image: mailhog/mailhog
        container_name: ${PROJECT_NAME}_mailhog
        restart: unless-stopped
        ports:
            - "1025:1025"   # SMTP
            - "8025:8025"   # interface web
        networks:
            - default

    phpmyadmin:
        image: phpmyadmin:latest
        container_name: ${PROJECT_NAME}_phpmyadmin
        restart: unless-stopped
        depends_on:
            - database
        ports:
            - "8081:80"
        environment:
            PMA_HOST: mysql
            PMA_PORT: 3306
            PMA_USER: root
            PMA_PASSWORD: root
        networks:
            - default

volumes:
    database_data:
    redis_data:
    caddy_data:
    caddy_config:

networks:
    default:
        name : ${PROJECT_NAME}

